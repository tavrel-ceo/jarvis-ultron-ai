services:
  - type: web
    name: aris-private-api
    runtime: node
    plan: free
    branch: feat/aris-mobile-foundation-20261012
    buildCommand: npm install
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ARIS_ENABLE_LOCAL_TOOLS
        value: "false"
      - key: ARIS_ENABLE_BACKGROUND_TASKS
        value: "false"
      - key: ARIS_ACCESS_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-120b
